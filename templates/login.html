{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white text-center py-3">
        <h4 class="mb-0"><i class="bi bi-arrow-repeat"></i> Brightloop Login</h4>
        <hr>
        <p class="text-center mb-0">
            New customer? <a href="{{ url_for('auth.register') }}">Create an Account</a>
        </p>
      </div>
      <div class="card-body p-4">
        <form method="POST" action="{{ url_for('auth.login') }}">
          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" name="email" required autofocus>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" required>
          </div>
          <div class="d-grid mt-3">
            <button type="submit" class="btn btn-primary btn-lg">
              <i class="bi bi-box-arrow-in-right"></i> Log In
            </button>
          </div>
        </form>
        <hr>
        <small class="text-muted">
          Demo credentials:<br>
          <strong>admin@brightloop.com</strong> / admin123<br>
          <strong>alice@example.com</strong> / alice123
        </small>
      </div>
    </div>
  </div>
</div>
{% endblock %}
